<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visa Fraud Detection Dashboard</title>
<style>body{background:#0b132b;color:#fff;font-family:Segoe UI,Tahoma,sans-serif;display:flex;justify-content:center;padding:40px;min-height:100vh;box-sizing:border-box}.dashboard{width:800px;background:#1c2541;padding:30px;border-radius:15px;box-shadow:0 4px 15px #0008}.card-box{background:linear-gradient(135deg,#1f4068,#162447);padding:20px;border-radius:12px;margin-bottom:20px;position:relative}.inputs{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:20px}input{background:#0b132b;border:1px solid #3a506b;color:#fff;padding:10px;border-radius:5px;text-align:center;font-size:16px;width:100%;box-sizing:border-box}.btn-group{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:20px}button{padding:12px;border:none;border-radius:5px;cursor:pointer;font-weight:bold;font-size:15px;transition:.3s}button:hover{opacity:.8;transform:translateY(-1px)}.btn-safe{background:#1b4d3e;color:#2ecc71}.btn-danger{background:#4a1c24;color:#e74c3c}.status-box{padding:20px;border-radius:8px;text-align:center;font-size:18px;font-weight:bold;background:#1b4d3e;color:#2ecc71;border:1px solid #2ecc71}.status-box.blocked{background:#4a1c24;color:#e74c3c;border:1px solid #e74c3c}.timer-badge{position:absolute;top:15px;left:15px;background:#5bc0be;color:#0b132b;padding:5px 10px;border-radius:20px;font-size:12px;font-weight:bold}@media(max-width:650px){body{padding:15px}.dashboard{padding:20px}.inputs,.btn-group{grid-template-columns:1fr}}</style>
</head>
<body><div class="dashboard"><div class="card-box"><div class="timer-badge">Strands Decider: <span id="latency">115ms</span></div><h2 style="margin-top:0">البطاقة المحمية | NOVA BANK</h2><p style="font-size:22px;letter-spacing:3px">4821 •••• •••• 9988</p><p style="margin-bottom:0">ARTHUR MORGAN</p></div><div class="inputs"><input id="amount" value="240" readonly><input id="merchant" value="Streamline Market" readonly><input id="location" value="Riyadh, SA" readonly><input id="time" value="10:42 AM" readonly></div><div class="btn-group"><button class="btn-danger" id="danger">🚨 محاكاة عملية مشبوهة</button><button class="btn-safe" id="safe">✅ محاكاة عملية آمنة</button></div><div class="status-box" id="statusBox"><div>تمت الموافقة على العملية - Approved</div><div style="font-size:14px;font-weight:normal;margin-top:5px">بطاقتك محمية وجاهزة للاستخدام.</div></div></div>
<script>
const API='http://127.0.0.1:8000/api/intervene', $=id=>document.getElementById(id), safe={amount:240,merchant:'Streamline Market',location:'Riyadh, SA',time:'10:42 AM',hour:10,device:'iPhone 15 Pro'}, danger={amount:5000,merchant:'International electronics',location:'Riyadh, SA',time:'03:00 AM',hour:3,device:'Unknown browser'};
function fill(tx){$('amount').value=tx.amount;$('merchant').value=tx.merchant;$('location').value=tx.location;$('time').value=tx.time}
function simulateDanger(){fill(danger);$('statusBox').className='status-box blocked';$('statusBox').innerHTML='<div>تم حظر العملية تلقائياً - Blocked (في 115ms)</div><div style="font-size:14px;font-weight:normal;margin-top:5px;color:#fff">🔒 تنبيه أمني من Amazon Bedrock: تم رصد محاولة شراء مرتفعة بمبلغ 5000 ريال في وقت متأخر. لحمايتك، تم الحظر مؤقتاً لحين تأكيد هويتك عبر الـ OTP.</div>';sendToLocalApi(danger)}
function simulateSafe(){fill(safe);$('statusBox').className='status-box';$('statusBox').innerHTML='<div>تمت الموافقة على العملية - Approved</div><div style="font-size:14px;font-weight:normal;margin-top:5px">بطاقتك محمية وجاهزة للاستخدام التلقائي.</div>';sendToLocalApi(safe)}
async function sendToLocalApi(tx){try{await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...tx,currency:'SAR',locale:'ar'})})}catch(_){}}
$('danger').onclick=simulateDanger;$('safe').onclick=simulateSafe;
</script></body></html>
